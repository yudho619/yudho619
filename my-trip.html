<!doctype html>
<html lang="id">
<!-- BAGIAN: HEAD | Menghubungkan halaman ringkasan perjalanan dengan stylesheet utama. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Trip - Explore Sumba Timur</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="my-trip">
  <!-- BAGIAN: HEADER DAN NAVIGASI | Navigasi konsisten agar pengguna mudah berpindah halaman. -->
  <header class="site-header">
    <a class="logo" href="index.html"><img src="assets/logo/logo_final.svg.svg" alt="Explore Sumba Timur"></a>
    <nav class="main-nav">
      <a href="index.html">Home</a><a href="explore.html">Explore</a><a href="planner.html">Trip Planner</a>
      <a href="about.html">About</a><a href="contact.html">Contact</a>
    </nav>
    <div class="header-icons"><button type="button" data-favorite aria-label="Favorit">♡</button><button type="button" data-open-cart aria-label="Rencana"></button></div>
  </header>
  <!-- BAGIAN: ROOT MY TRIP | extended.js membaca cart dan rencana dari LocalStorage lalu menampilkan itinerary dan total. -->
  <main class="container planner-page" id="myTripContent"></main>
  <!-- BAGIAN: KOMPONEN GLOBAL | Cart drawer, footer, dan toast digunakan kembali dari app.js. -->
  <aside class="cart-drawer" id="cartDrawer"></aside>
  <footer class="site-footer" id="footer"></footer>
  <div class="toast" id="toast"></div>
  <!-- URUTAN SCRIPT: data sebagai sumber, app untuk fitur umum, extended untuk membuat halaman My Trip. -->
  <script src="js/data.js"></script><script src="js/app.js"></script><script src="js/extended.js"></script>
</body>
</html>
