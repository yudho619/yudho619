<!doctype html>
<html lang="id">
<!-- BAGIAN: HEAD | Menyiapkan metadata dan stylesheet halaman detail. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail Destinasi - Explore Sumba Timur</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="detail">
  <!-- BAGIAN: HEADER DAN NAVIGASI | Explore tetap aktif karena Detail merupakan lanjutan dari katalog Explore. -->
  <header class="site-header">
    <a class="logo" href="index.html"><img src="assets/logo/logo_final.svg.svg" alt="Explore Sumba Timur"></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a class="active" href="explore.html">Explore</a>
      <a href="planner.html">Trip Planner</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-icons"><button type="button" data-favorite aria-label="Favorit">♡</button><button type="button" data-open-cart aria-label="Rencana"></button></div>
  </header>

  <!-- BAGIAN: KONTEN DETAIL DINAMIS | extended.js membaca URL seperti ?id=walakiri, mencari data di data.js, lalu mengisi detailContent. -->
  <main class="container detail-page" id="detailContent"></main>
  <!-- BAGIAN: KOMPONEN GLOBAL | Cart dan footer dibentuk app.js; toast menampilkan pesan singkat. -->
  <aside class="cart-drawer" id="cartDrawer"></aside>
  <footer class="site-footer" id="footer"></footer>
  <div class="toast" id="toast"></div>
  <!-- URUTAN SCRIPT: data.js menyediakan data, app.js fitur umum, extended.js membangun isi Detail. -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/extended.js"></script>
</body>
</html>
