<!doctype html>
<html lang="id">
<!-- BAGIAN: HEAD | Menyiapkan metadata dan stylesheet halaman Trip Planner. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Planner - Explore Sumba Timur</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="planner">
  <!-- BAGIAN: HEADER DAN NAVIGASI | Trip Planner diberi class active untuk menandai halaman yang dibuka. -->
  <header class="site-header">
    <a class="logo" href="index.html"><img src="assets/logo/logo_final.svg.svg" alt="Explore Sumba Timur"></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      <a class="active" href="planner.html">Trip Planner</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-icons"><button type="button" data-favorite aria-label="Favorit">♡</button><button type="button" data-open-cart aria-label="Rencana"></button></div>
  </header>
  <!-- BAGIAN: ROOT TRIP PLANNER | planner-v2.js membangun formulir bertahap dan ringkasan biaya di plannerContent. -->
  <main class="container planner-page" id="plannerContent"></main>
  <!-- BAGIAN: KOMPONEN GLOBAL | app.js mengendalikan cart drawer, footer, dan toast. -->
  <aside class="cart-drawer" id="cartDrawer"></aside>
  <footer class="site-footer" id="footer"></footer>
  <div class="toast" id="toast"></div>
  <!-- URUTAN SCRIPT: data.js -> app.js -> extended.js -> planner-v2.js. File terakhir menampilkan planner versi terbaru. -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/extended.js"></script>
  <script src="js/planner-v2.js"></script>
</body>
</html>
