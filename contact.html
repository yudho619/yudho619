<!doctype html>
<html lang="id">
<!-- BAGIAN: HEAD | Menyiapkan metadata dan stylesheet halaman kontak. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Explore Sumba Timur</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <!-- BAGIAN: HEADER DAN NAVIGASI | Contact aktif untuk memberi penanda lokasi halaman. -->
  <header class="site-header">
    <a class="logo" href="index.html"><img src="assets/logo/logo_final.svg.svg" alt="Explore Sumba Timur"></a>
    <nav class="main-nav">
      <a href="index.html">Home</a><a href="explore.html">Explore</a><a href="planner.html">Trip Planner</a><a href="about.html">About</a><a class="active" href="contact.html">Contact</a>
    </nav>
    <div class="header-icons"><button type="button" data-favorite aria-label="Favorit">♡</button><button type="button" data-open-cart aria-label="Rencana"></button></div>
  </header>
  <!-- BAGIAN: ROOT CONTACT | extended.js membangun informasi kontak dan form, memvalidasi, lalu menyimpan draft ke LocalStorage. -->
  <main class="container planner-page" id="contactContent"></main>
  <!-- BAGIAN: KOMPONEN GLOBAL | Cart drawer, footer, dan toast berasal dari app.js. -->
  <aside class="cart-drawer" id="cartDrawer"></aside>
  <footer class="site-footer" id="footer"></footer>
  <div class="toast" id="toast"></div>
  <!-- URUTAN SCRIPT: data.js -> app.js -> extended.js. -->
  <script src="js/data.js"></script><script src="js/app.js"></script><script src="js/extended.js"></script>
</body>
</html>
